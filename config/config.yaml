########## 02 Assembly.smk parameters ########

# Metaspade parameters
Metaspade_assembly:
  threads: 10
  memory_mb: 400000
  runtime_min: 4320


# MetaQuast parameters
MetaQuast:
  threads: 4
  memory_mb: 64000
  runtime_min: 120


# Contig filtering parameters
Contig_filter:
  length_threshold: 1500 # minimum contig length for binning (bp)
  coverage_threshold: 1

########### 03 Binning.smk parameters #############
# SAMPLE excluded from the Binning
exclude_samples:
- Glomus_China25_F_1
- Glomus_China25_F_17
- Glomus_China25_F_25
- Glomus_China25_F_49

########### Backmapping ###################
# Bowtie2 parameters
Contig_indexing:
  threads: 8
  memory_mb: 16000
  runtime_min: 120

Contig_Backmapping:
  threads: 16
  memory_mb: 40000
  runtime_min: 4320

######### Binning Tools Parameters #########
# Metabat2 parameters

MetaBat2:
  threads: 8
  memory_mb: 45000
  runtime_min: 300
  # extra options
  min_contig_length: 1500 # tool default is 2500 bp; lowered for sensitivity

# Maxbin2 parameters
MaxBin2:
  threads: 16
  memory_mb: 30000
  runtime_min: 2880
  # extra options
  min_contig_length: 1500 # tool default is 1000 bp; raised to match MetaBat2

# CONCOCT parameters
CONCOCT:
  threads: 8
  memory_mb: 45000
  runtime_min: 2880
  # extra options
  min_contig_length: 1500 # tool default is 1000 bp; raised to match MetaBat2
  chunk_size: 10000 # default 10000 bp for CONCOCT
  overlap_size: 0 # default 2500 bp for CONCOCT
  coverage_runtime: 120

# DASTool parameters
DASTool:
  threads: 8
  memory_mb: 80000
  runtime_min: 120
  # extra options
  search_engine: diamond # default is usearch, can be set to diamond


############ QC parameters #############

# CheckM parameters
CheckM:
  threads: 4
  memory_mb: 128000
  runtime_min: 240
  # set CheckM database path if needed
  db: /work/FAC/FBM/DBC/fmazel/gut_evol_stg/shared/Database/checkM_db

# Bin quality filtering parameters
Bin_filtering:
  completeness: 90
  contamination: 5

############ 04 MAGs parameters #############

# GTDB-Tk parameters
GTDB_Tk:
  threads: 32
  memory_mb: 64000
  runtime_min: 1440
  # set GTDB-Tk database path if needed
