# CONFIGURATION FILE METAGENOMIC PIPELINE 
# Last Updated: 2026-07-28
# Author: Matias Becker Burgos (Matias.BeckerBurgos@unil.ch)

######################################################
# DESCRIPTION
######################################################
# This configuration file contains paths and parameters for Mazel lab Metagenomic pipeline. 
# Adjust the paths below to match your
# project structure and computational environment.
######################################################
# WORKING DIRECTORIES
######################################################
# directory where all the analysis will be performed.
# Examples:
#   working_dir: /home/username/projects/2025_SOMETALP_MetaG_Project

working_dir: 

# path to a scratch directory for temporary files.
# Examples:
#   scratch_dir: /tmp/username

scratch_dir: 

# path to the raw data directory containing input FASTQ files.

input_dir: 

# path to the log directory for storing log files.

log_dir: 

# path to the benchmark directory for storing benchmark files.
benchmark_dir: 

#########################################################
# SAMPLE DETECTION
#########################################################
# Regex applied to each filename in input_dir; group 1 = sample name.
# Override per project without editing code.
sample_pattern: '^(Pl\d+_[A-Z]\d+)_.*$'

#########################################################
# BLANK / CONTROL SAMPLE EXCLUSION
#########################################################
# Excluded samples are kept through QC and assembly (useful for contamination checks)
# but removed from binning and all downstream steps.
#
# Two complementary mechanisms — their union is used:
#   exclude_samples : explicit names (useful for one-off edge cases)
#   exclude_pattern : regex matched against sample name; "" = disabled
#                     e.g. '^.*(blank|BLANK|ctrl|NEG).*$'
#
# List format: one "- name" per line, no quotes needed. Keep "[]" to exclude nothing —
# a lone "-" with nothing after it is read as a blank entry and stops the run.
#   exclude_samples:
#   - E_PP
#   - E_M
exclude_samples: []

exclude_pattern: ""   # set to a regex to exclude samples by name pattern

#########################################################
# INCLUDE/EXCLUDE STEPS
#########################################################
# Set to true or false to include/exclude specific steps
steps:
  QC: true                          # Include QC & preprocessing step When QC: false, run FastQC+MultiQC on pre-cleaned reads to verify quality
  concatenate_lanes: true          # true = cat multi-lane files, named {sample}_L*_R1* / {sample}_L*_R2*
                                   # false = symlink one file per read, named {sample}_R1* / {sample}_R2*
                                   #   (the lane/read tag must follow the sample name directly, e.g.
                                   #   01_PP_L001_R1_001.fastq.gz or 01_PP_R1.fastq.gz, not 01_PP_S12_R1_001.fastq.gz)
  taxonomic_profiling: false        # Kraken2 profiling of the cleaned reads (needs kraken2_db.DB_dir)
  alternative_binning: false        # false = MetaBAT2+MaxBin2+SemiBin2+DAS_Tool (needs >=5 non-excluded samples, for SemiBin2);
                                    # true = standalone MetaBAT2 (03b)
  MAGs_Reporting_step: true         # Include MAGs reporting & annotation (04)
  iTOL_visualisation: true          # With MAGs_Reporting_step: GTDB-Tk tree of all HQ MAGs + iTOL annotation files (needs DATA_VARIABLES.metadata_path for host strips)
  final_report: false               # Generate a pipeline-wide MultiQC final report
                                    # (with QC: true this also runs Kraken2 on every sample's trimmed reads, for
                                    #  the report's Kraken section, so it needs kraken2_db.DB_dir too)

#########################################################
# SOFTWARE PARAMETERS
#########################################################
# General parameters for all tools

######## 01 Preprocessing.smk parameters ########

# Concatenate parameters
Concatenate:
  threads: 2
  runtime_min: 5

# FastQC parameters
fastqc:
  threads: 2
  memory_mb: 1000
  runtime_min: 35

# MultiQC parameters
multiqc:
  threads: 1
  memory_mb: 600
  runtime_min: 10

# Trimmomatic parameters
trimmomatic:
  # Adapter FASTA for ILLUMINACLIP, matching your library prep: NexteraPE-PE.fa (Nextera/
  # Illumina DNA Prep) or TruSeq3-PE-2.fa (TruSeq). These ship with Trimmomatic, and are in
  # its GitHub repo (usadellab/Trimmomatic, adapters/). Required when QC: true.
  trimmomatic_adapters:
  leading: 28
  trailing: 28
  minlen: 60
  # Ressources allocation
  threads: 8
  memory_mb: 6000
  runtime_min: 300

# Kraken2 parameters (host filtering + taxonomic classification rules)
# Database parameters
kraken2_db:
  # Path to an existing Kraken2 database folder (the one holding hash.k2d, opts.k2d, taxo.k2d).
  # Needed when taxonomic_profiling: true, or QC: true with final_report: true; may stay blank
  # otherwise. A real run checks the folder exists before starting any job. (A dry run lists a
  # build_Kraken2_db job instead when it's missing — that also means the path is wrong.)
  DB_dir:
  # build_Kraken2_db (bacteria + human + refseq below): kept for reference; the start-up check
  # above means the pipeline won't build a missing database, so build/download one beforehand.
  threads: 32
  memory_mb: 500000
  runtime_min: 2880
  disk_mb: 1000000
  # Extra host genomes for build_Kraken2_db (ignored when DB_dir already exists).
  # FASTA files whose headers carry the NCBI taxid in Kraken format, e.g.
  #   >NC_000067.7|kraken:taxid|10090 Mus musculus chromosome 1
  # One "- path" per line, no quotes needed, no spaces in paths. Keep "[]" for none.
  #   refseq:
  #   - /path/to/hosts/mouse_kraken.fna
  refseq: []

# Run parameters
kraken2_run:
  threads: 4
  memory_mb: 200000
  runtime_min: 180


# Bowtie2 parameters for host filtering 
# Index building parameters
host_indexing:
  threads: 20
  memory_mb: 50000
  runtime_min: 240
  # Host genomes the Bowtie2 index is BUILT from (ignored when the index in
  # host_filtering.index_path already exists). Plain, uncompressed FASTA (.fa/.fna), no special
  # headers. One "- path" per line; quotes optional, but no spaces in paths. Keep "[]" if the
  # index already exists. Indexing several mammal genomes (~15 Gbp) can take longer than
  # runtime_min above — raise it when building a new index.
  #   Host_refs:
  #   - /path/to/hosts/Mus_musculus/GCF_000001635.27_GRCm39_genomic.fna
  #   - /path/to/hosts/Homo_sapiens/GCF_000001405.40_GRCh38.p14_genomic.fna
  Host_refs: []

# Host filtering parameters
host_filtering:
  # Ressources allocation
  threads: 20
  memory_mb: 30000
  runtime_min: 600
  # Index PREFIX, not a folder: for index files /path/to/bowtie2_index/my_index.1.bt2l,
  # .2.bt2l, .3.bt2l, .4.bt2l, .rev.1.bt2l, .rev.2.bt2l, write /path/to/bowtie2_index/my_index
  # The pipeline expects large-index (.bt2l) files; if they are missing, host_indexing
  # builds them from Host_refs above.
  index_path:

########## 02 Assembly.smk parameters ########

# Metaspade parameters
Metaspade_assembly:
  threads: 10
  memory_mb: 400000
  runtime_min: 4320


# MetaQuast parameters
MetaQuast:
  threads: 4
  memory_mb: 64000
  runtime_min: 120


# Contig filtering parameters
Contig_filter:
  length_threshold: 1500 # minimum contig length for binning (bp)
  coverage_threshold: 1

########### 03 Binning.smk parameters #############
# Sample exclusion from binning uses exclude_samples: / exclude_pattern: above
# (see BLANK / CONTROL SAMPLE EXCLUSION section).

########### Backmapping (alignment-free) ###################
# Fairy parameters — replaces Bowtie2 contig indexing + all-vs-all backmapping
Fairy_sketch:
  threads: 8
  memory_mb: 16000
  runtime_min: 120

Fairy_coverage:
  threads: 8
  memory_mb: 16000
  runtime_min: 60      # reused by all three per-contig fairy coverage invocations

######### Binning Tools Parameters #########
# Metabat2 parameters

MetaBat2:
  threads: 8
  memory_mb: 45000
  runtime_min: 300
  # extra options
  min_contig_length: 1500 # tool default is 2500 bp; lowered for sensitivity

# Maxbin2 parameters
MaxBin2:
  threads: 16
  memory_mb: 30000
  runtime_min: 2880
  # extra options
  min_contig_length: 1500 # tool default is 1000 bp; raised to match MetaBat2

# SemiBin2 parameters (replaces CONCOCT in the consensus set) — note SemiBin2's -a
# abundance mode requires >=5 samples in the binning set; below that it errors out.
SemiBin2:
  threads: 16
  memory_mb: 45000
  runtime_min: 2880
  coverage_runtime: 120

# DASTool parameters
DASTool:
  threads: 8
  memory_mb: 80000
  runtime_min: 120
  # extra options
  search_engine: diamond # default is usearch, can be set to diamond


############ QC parameters #############

# CheckM2 parameters
CheckM:
  threads: 4
  memory_mb: 128000
  runtime_min: 240
  # CheckM2 DIAMOND database — the .dmnd FILE, not its folder. Download once with
  #   checkm2 database --download --path <dir>
  # then set db: <dir>/CheckM2_database/uniref100.KO.1.dmnd   (always required)
  db:

# Bin quality filtering parameters
Bin_filtering:
  completeness: 90
  contamination: 5

############ 04 MAGs parameters #############

# GTDB-Tk parameters
GTDB_Tk:
  threads: 32
  memory_mb: 160000   # GTDB release 232 needs ~140 GB for bacterial placement
  runtime_min: 1440
  db:  # GTDB-Tk database path: the release 232 reference package (gtdbtk_r232_data.tar.gz, unpacked)

# DATA VARIABLES AND COLORS FOR ITOL VISUALIZATIONS
# Only used with iTOL_visualisation: true. Leave metadata_path blank to build the tree only
# (no host annotation strips).
DATA_VARIABLES:
  # Tab-separated file (or .xlsx), one row per sample, with at least the two columns below.
  metadata_path:
  col_host: "Host_species"     # column holding each sample's host (values = host_colors keys)
  col_sample_id: "Glomus_ID"   # column holding sample names exactly as the pipeline detects them
  # Text after the sample name in MAG names; the part before it must match col_sample_id.
  # "_DASTool_" for alternative_binning: false ({sample}_DASTool_bin_1.fa),
  # "_bin" for alternative_binning: true ({sample}_bin.1.fa).
  split_criteria: "_DASTool_"

# Colors for host species in iTOL visualizations (can be modified for any species in dataset)
host_colors:
  Apodemus chevrieri: "#DEB887"
  Apodemus draco: "#CDAA7D"
  Apodemus nigrus: "#8B5A2B"
  Apodemus sp.: "#99582a"
  Apodemus latronum: "#432818"
  Apodemus ilex: "#ffe6a7"

# dRep parameters
dRep:
  threads: 16
  memory_mb: 64000
  runtime_min: 1440
  # extra options
  completeness_threshold: 90 # default 50% for dRep
  contamination_threshold: 5 # default 10% for dRep
  secondary_clustering_ANI: 0.95 # default 95% for dRep secondary clustering
