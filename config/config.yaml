# CONFIGURATION FILE METAGENOMIC PIPELINE 
# Last Updated: 2026-07-28
# Author: Matias Becker Burgos (Matias.BeckerBurgos@unil.ch)

######################################################
# DESCRIPTION
######################################################
# This configuration file contains paths and parameters for Mazel lab Metagenomic pipeline. 
# Adjust the paths below to match your
# project structure and computational environment.
######################################################
# WORKING DIRECTORIES
######################################################
# directory where all the analysis will be performed.
# Examples:
#   working_dir: /home/username/projects/2025_SOMETALP_MetaG_Project

working_dir: 

# path to a scratch directory for temporary files.
# Examples:
#   scratch_dir: /tmp/username

scratch_dir: 

# path to the raw data directory containing input FASTQ files.

input_dir: 

# path to the log directory for storing log files.

log_dir: 

# path to the benchmark directory for storing benchmark files.
benchmark_dir: 

#########################################################
# SAMPLE DETECTION
#########################################################
# Regex applied to each filename in input_dir; group 1 = sample name.
# Override per project without editing code.
sample_pattern: '^(Pl\d+_[A-Z]\d+)_.*$'

#########################################################
# BLANK / CONTROL SAMPLE EXCLUSION
#########################################################
# Excluded samples are kept through QC and assembly (useful for contamination checks)
# but removed from binning and all downstream steps.
#
# Two complementary mechanisms — their union is used:
#   exclude_samples : explicit names (useful for one-off edge cases)
#   exclude_pattern : regex matched against sample name; "" = disabled
#                     e.g. '^.*(blank|BLANK|ctrl|NEG).*$'
exclude_samples:
- 

exclude_pattern: ""   # set to a regex to exclude samples by name pattern

#########################################################
# INCLUDE/EXCLUDE STEPS
#########################################################
# Set to true or false to include/exclude specific steps
steps:
  QC: true                          # Include QC & preprocessing step When QC: false, run FastQC+MultiQC on pre-cleaned reads to verify quality
  concatenate_lanes: true          # true = cat multi-lane files; false = symlink single pre-concatenated files
  taxonomic_profiling: false        # Include Kraken2 taxonomic profiling
  alternative_binning: false        # Use alternative binning with MetaBAT2 (03b) instead of Classic DASTool
  MAGs_Reporting_step: true         # Include MAGs reporting & annotation (04)
  final_report: false               # Generate a pipeline-wide MultiQC final report

#########################################################
# SOFTWARE PARAMETERS
#########################################################
# General parameters for all tools

######## 01 Preprocessing.smk parameters ########

# Concatenate parameters
Concatenate:
  threads: 2
  runtime_min: 5

# FastQC parameters
fastqc:
  threads: 2
  memory_mb: 1000
  runtime_min: 35

# MultiQC parameters
multiqc:
  threads: 1
  memory_mb: 600
  runtime_min: 10

# Trimmomatic parameters
trimmomatic:
  trimmomatic_adapters: # path to stored adaptaters
  leading: 28
  trailing: 28
  minlen: 60
  # Ressources allocation
  threads: 8
  memory_mb: 6000
  runtime_min: 300

# Kraken2 parameters (host filtering + taxonomic classification rules)
# Database parameters
kraken2_db:
  DB_dir: #path to Kraken Database
  # Ressources allocation for building the database
  threads: 32
  memory_mb: 500000
  runtime_min: 2880
  disk_mb: 1000000
# Formatted Reference genomes for host filtering in Kraken2
  refseq:
  - # Path to Kraken formatted Host reference genome fasta files
    

# Run parameters
kraken2_run:
  threads: 4
  memory_mb: 200000
  runtime_min: 180


# Bowtie2 parameters for host filtering 
# Index building parameters
host_indexing:
  threads: 20
  memory_mb: 50000
  runtime_min: 240
  # Reference genomes for host filtering in Bowtie2
  Host_refs:
  - # Path to Host reference genome for Host decontam (can be same as in Kraken2)

# Host filtering parameters
host_filtering:
  # Ressources allocation
  threads: 20
  memory_mb: 30000
  runtime_min: 600
  # Index for host filtering
  index_path: # path to the index directory 

########## 02 Assembly.smk parameters ########

# Metaspade parameters
Metaspade_assembly:
  threads: 10
  memory_mb: 400000
  runtime_min: 4320


# MetaQuast parameters
MetaQuast:
  threads: 4
  memory_mb: 64000
  runtime_min: 120


# Contig filtering parameters
Contig_filter:
  length_threshold: 1500 # minimum contig length for binning (bp)
  coverage_threshold: 1

########### 03 Binning.smk parameters #############
# Sample exclusion from binning uses exclude_samples: / exclude_pattern: above
# (see BLANK / CONTROL SAMPLE EXCLUSION section).

########### Backmapping ###################
# Bowtie2 parameters
Contig_indexing:
  threads: 8
  memory_mb: 16000
  runtime_min: 120

Contig_Backmapping:
  threads: 16
  memory_mb: 40000
  runtime_min: 4320

######### Binning Tools Parameters #########
# Metabat2 parameters

MetaBat2:
  threads: 8
  memory_mb: 45000
  runtime_min: 300
  # extra options
  min_contig_length: 1500 # tool default is 2500 bp; lowered for sensitivity

# Maxbin2 parameters
MaxBin2:
  threads: 16
  memory_mb: 30000
  runtime_min: 2880
  # extra options
  min_contig_length: 1500 # tool default is 1000 bp; raised to match MetaBat2

# CONCOCT parameters
CONCOCT:
  threads: 8
  memory_mb: 45000
  runtime_min: 2880
  # extra options
  min_contig_length: 1500 # tool default is 1000 bp; raised to match MetaBat2
  chunk_size: 10000 # default 10000 bp for CONCOCT
  overlap_size: 0 # default 2500 bp for CONCOCT
  coverage_runtime: 120

# DASTool parameters
DASTool:
  threads: 8
  memory_mb: 80000
  runtime_min: 120
  # extra options
  search_engine: diamond # default is usearch, can be set to diamond


############ QC parameters #############

# CheckM parameters
CheckM:
  threads: 4
  memory_mb: 128000
  runtime_min: 240
  # set CheckM database path if needed
  db: # Set CheckM database path

# Bin quality filtering parameters
Bin_filtering:
  completeness: 90
  contamination: 5

############ 04 MAGs parameters #############

# GTDB-Tk parameters
GTDB_Tk:
  threads: 32
  memory_mb: 64000
  runtime_min: 1440
  # set GTDB-Tk database path if needed
  db:  # GTDB-Tk database path (temporary borrowed from engel lab)

# DATA VARIABLES AND COLORS FOR ITOL VISUALIZATIONS
DATA_VARIABLES:
  metadata_path:  # Path to metadata file
  col_host: "Host_species" # Column name in metadata file for host species
  split_criteria: "_DASTool_" # Character to split user_genome to extract Sample_ID
  col_sample_id: "Glomus_ID" # Column name in metadata file for sample IDs

# Colors for host species in iTOL visualizations (can be modified for any species in dataset)
host_colors:
  Apodemus chevrieri: "#DEB887"
  Apodemus draco: "#CDAA7D"
  Apodemus nigrus: "#8B5A2B"
  Apodemus sp.: "#99582a"
  Apodemus latronum: "#432818"
  Apodemus ilex: "#ffe6a7"

# dRep parameters
dRep:
  threads: 16
  memory_mb: 64000
  runtime_min: 1440
  # extra options
  completeness_threshold: 90 # default 50% for dRep
  contamination_threshold: 5 # default 10% for dRep
  secondary_clustering_ANI: 0.95 # default 95% for dRep secondary clustering
