######################################################
# DESCRIPTION
######################################################
# This configuration file contains paths and parameters for the GLOMUS
# China pilot project. Adjust the paths below to match your
# project structure and computational environment.
######################################################
# WORKING DIRECTORIES
######################################################
# directory where all the analysis will be performed.
# Examples:
#   working_dir: /home/username/projects/2025_SOMETALP_MetaG_Project

working_dir: /work/FAC/FBM/DBC/fmazel/gut_evol_stg/mbeckerb/2026_GLOMUS/2026_CHINA_pilot

# path to a scratch directory for temporary files.
# Examples:
#   scratch_dir: /tmp/username

scratch_dir: /scratch/mbeckerb

# path to the raw data directory containing input FASTQ files.

input_dir: /work/FAC/FBM/DBC/fmazel/gut_evol_stg/mbeckerb/2026_GLOMUS/2026_CHINA_pilot/00_Data/02_Clean_Data

# path to the log directory for storing log files.

log_dir: /users/mbeckerb/Projects/2026_GLOMUS/2026_CHINA_pilot/logs

# path to the benchmark directory for storing benchmark files.
benchmark_dir: /users/mbeckerb/Projects/2026_GLOMUS/2026_CHINA_pilot/benchmark

#########################################################
# SAMPLE DETECTION
#########################################################
# Regex applied to each filename in input_dir; group 1 = sample name.
# Override per project without editing code.
sample_pattern: '^(Pl\d+_[A-Z]\d+)_.*$'

#########################################################
# BLANK / CONTROL SAMPLE EXCLUSION
#########################################################
# Excluded samples are kept through QC and assembly (useful for contamination checks)
# but removed from binning and all downstream steps.
#
# Two complementary mechanisms — their union is used:
#   exclude_samples : explicit names (useful for one-off edge cases)
#   exclude_pattern : regex matched against sample name; "" = disabled
#                     e.g. '^.*(blank|BLANK|ctrl|NEG).*$'
exclude_samples:
- Glomus_China25_F_1
- Glomus_China25_F_17
- Glomus_China25_F_25
- Glomus_China25_F_49

exclude_pattern: ""   # set to a regex to exclude samples by name pattern

#########################################################
# INCLUDE/EXCLUDE STEPS
#########################################################
# Set to true or false to include/exclude specific steps
steps:
  QC: true                          # Include QC & preprocessing step When QC: false, run FastQC+MultiQC on pre-cleaned reads to verify quality
  concatenate_lanes: true          # true = cat multi-lane files; false = symlink single pre-concatenated files
  taxonomic_profiling: false        # Include Kraken2 taxonomic profiling
  alternative_binning: false        # Use alternative binning with MetaBAT2 (03b) instead of Classic DASTool
  MAGs_Reporting_step: true         # Include MAGs reporting & annotation (04)
  final_report: false               # Generate a pipeline-wide MultiQC final report

#########################################################
# SOFTWARE PARAMETERS
#########################################################
# General parameters for all tools

######## 01 Preprocessing.smk parameters ########

# Concatenate parameters
Concatenate:
  threads: 2
  runtime_min: 5

# FastQC parameters
fastqc:
  threads: 2
  memory_mb: 1000
  runtime_min: 35

# MultiQC parameters
multiqc:
  threads: 1
  memory_mb: 600
  runtime_min: 10

# Trimmomatic parameters
trimmomatic:
  trimmomatic_adapters: /work/FAC/FBM/DBC/fmazel/gut_evol_stg/shared/Database/trimmomatic/adapters/NexteraPE-PE.fa
  leading: 28
  trailing: 28
  minlen: 60
  # Ressources allocation
  threads: 8
  memory_mb: 6000
  runtime_min: 300

# Kraken2 parameters (host filtering + taxonomic classification rules)
