name: Validate Snakemake DAG

# Dry-runs the pipeline against test_data/ (synthetic smoke-test fixture, see
# test_data/README.md) for both binning branches, to catch rule/config wiring
# breakage before it reaches real pilot data. Does NOT build the bioinformatics
# tool conda environments or execute any real rule — snakemake -n only needs
# Snakemake itself to validate that the DAG, config, and scripts' CLI wiring
# are internally consistent.
#
# Known gap: test_data/reads/ are pre-"cleaned" reads (steps.QC: false), so
# this does not exercise the steps.QC: true (raw multi-lane -> host-filtering)
# branch of 01_quality_control_preprocessing.smk.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  dag-dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        alternative_binning: [false, true]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          channel-priority: strict
          activate-environment: snakemake-ci

      - name: Install Snakemake
        shell: bash -el {0}
        run: mamba install -n snakemake-ci -y "snakemake>=8"

      - name: Prepare run scaffolding (gitignored outputs + dummy GTDB-Tk db)
        run: |
          mkdir -p test_data/_run/{output,scratch,logs,benchmarks,dummy_gtdb_db}
          # NOTE: `--config 'steps={"alternative_binning": ...}'` looks like the
          # obvious way to override this, but Snakemake parses nested --config
          # dict values with yaml.BaseLoader, which does NOT coerce "true"/"false"
          # to booleans — the override silently becomes the *string* "false",
          # which is truthy, so BOTH matrix legs would run alternative_binning:
          # true. A real YAML file loaded via --configfile does proper boolean
          # parsing, so we write one here instead.
          cat > test_data/_run/override.yaml <<EOF
          steps:
            alternative_binning: ${{ matrix.alternative_binning }}
          GTDB_Tk:
            db: "../test_data/_run/dummy_gtdb_db"
          EOF

      - name: Dry-run DAG (alternative_binning=${{ matrix.alternative_binning }})
        shell: bash -el {0}
        run: |
          cd workflow
          snakemake -n --configfile ../test_data/config.test.yaml ../test_data/_run/override.yaml
