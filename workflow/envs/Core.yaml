# Read QC, host filtering, Kraken2, assembly, reporting + the pipeline's own Python scripts
# (01/01b, 02, 02b, every Python parsing rule in 03/03b/04, 05 final MultiQC).
# Replaces QC_env / Trimmomatic / bowtie2_mapping / Parsing / Kraken2 / Assembly: these are standalone
# binaries plus a small Python stack, and resolve together (verified for linux-64). Superset of
# 03_Community_Analysis_Pipeline's Core.yaml (+ kraken2, spades, quast) — keep the shared pins in sync.
# Dropped as unused by any rule: samtools, bbmap, blast, bracken.
name: Core_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - fastqc=0.12.1
  - multiqc=1.35        # >= 1.26 for the native checkm2 / gtdbtk report modules
  - trimmomatic=0.39
  - bowtie2=2.5.3
  - kraken2=2.1.3
  - spades=4.0.0
  - quast=5.2.0
  - python=3.10
  - pandas=2.0          # also covers aggregate_benchmarks.py in final_multiqc
  - numpy=1.26
  - biopython=1.83
  - pyyaml=6.0
  - matplotlib=3.8
  - openpyxl=3.1
